apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      containers:
      - name: vprodb
        image: rarias1082/vprofiledb
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: db-pass
        volumeMounts:
        - name: vpro-db-data
          mountPath: /var/lib/mysql   # MySQL data directory
      volumes:
      - name: vpro-db-data
        persistentVolumeClaim:
          claimName: db-pv-claim   # ✅ corrected spelling

      # initContainer to clean lost+found (common with ext4 EBS volumes)
      initContainers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "rm -rf /var/lib/mysql/lost+found"]
        volumeMounts:
        - name: vpro-db-data
          mountPath: /var/lib/mysql
